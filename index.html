<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Inventario Magazzino</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<header>
    <h1>📦 Inventario Magazzino</h1>
</header>

<section class="controls">
    <input type="file" id="fileInput" accept=".xlsx">
    <input type="text" id="searchInput" placeholder="Cerca per SKU o Nome">
    <button id="exportBtn">⬇️ Esporta Excel</button>
    <button id="resetBtn" class="danger">🗑 Reset inventario</button>
</section>

<p id="saveStatus">Nessuna modifica</p>

<section class="table-container">
    <table id="inventoryTable">
        <thead>
            <tr>
                <th>SKU</th>
                <th>Nome</th>
                <th>Posizione</th>
                <th>Giacenza</th>
                <th>Note</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<script src="script.js"></script>
</body>
</html>
